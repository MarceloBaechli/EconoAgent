<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EconoAgent IA</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            min-height: 100vh;
            color: #1e293b;
        }

        .container {
            max-width: 1100px;
            margin: auto;
            padding: 30px;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 25px;
        }

        .header h1 {
            font-size: 38px;
            margin-bottom: 8px;
        }

        .header p {
            color: #cbd5e1;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }

        .card {
            background: rgba(255,255,255,0.10);
            border: 1px solid rgba(255,255,255,0.15);
            color: white;
            padding: 18px;
            border-radius: 14px;
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
        }

        .card:hover {
            background: rgba(255,255,255,0.20);
            transform: translateY(-3px);
        }

        .chat-container {
            background: white;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0,0,0,0.25);
        }

        .chat-header {
            background: #2563eb;
            color: white;
            padding: 18px 25px;
            font-weight: bold;
            font-size: 18px;
        }

        #chat {
            height: 500px;
            overflow-y: auto;
            padding: 25px;
            background: #f8fafc;
        }

        .mensaje {
            display: flex;
            margin-bottom: 16px;
        }

        .usuario {
            justify-content: flex-end;
        }

        .agente {
            justify-content: flex-start;
        }

        .burbuja {
            max-width: 75%;
            padding: 13px 17px;
            border-radius: 15px;
            line-height: 1.5;
            white-space: pre-wrap;
        }

        .usuario .burbuja {
            background: #2563eb;
            color: white;
            border-bottom-right-radius: 4px;
        }

        .agente .burbuja {
            background: white;
            border: 1px solid #e2e8f0;
            box-shadow: 0 3px 8px rgba(0,0,0,0.05);
            border-bottom-left-radius: 4px;
        }

        .cargando {
            color: #64748b;
            font-style: italic;
        }

        .input-area {
            display: flex;
            gap: 10px;
            padding: 18px;
            background: white;
            border-top: 1px solid #e2e8f0;
        }

        #mensaje {
            flex: 1;
            padding: 14px 18px;
            border-radius: 12px;
            border: 1px solid #cbd5e1;
            outline: none;
            font-size: 15px;
        }

        #mensaje:focus {
            border-color: #2563eb;
        }

        button {
            border: none;
            background: #2563eb;
            color: white;
            border-radius: 12px;
            padding: 0 25px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }
        
        .tabla-contenedor {
            width: 100%;
            overflow-x: auto;
            margin: 15px 0;
        }

        .tabla-economica {
            width: 100%;
            border-collapse: collapse;
            background: white;
            font-size: 14px;
        }

        .tabla-economica th {
            background: #2563eb;
            color: white;
            padding: 12px;
            text-align: center;
            border: 1px solid #dbeafe;
        }

        .tabla-economica td {
            padding: 10px 12px;
            text-align: center;
            border: 1px solid #e2e8f0;
        }

        .tabla-economica tr:nth-child(even) {
            background: #f8fafc;
        }

        .tabla-economica tr:hover {
            background: #eff6ff;
        }

        .texto-agente {
            margin-bottom: 10px;
            line-height: 1.6;
        }
            .btn-excel {
        margin-top: 12px;
        padding: 10px 18px;
        background: #16a34a;
        color: white;
        border: none;
        border-radius: 9px;
        cursor: pointer;
        font-weight: bold;
    }

    .btn-excel:hover {
        background: #15803d;
    }
    .grafica-contenedor {
    width: 100%;
    margin-top: 20px;
    padding: 15px;
    background: white;
    border: 1px solid #e2e8f0;
    border-radius: 12px;
}

.grafica-titulo {
    font-weight: bold;
    margin-bottom: 12px;
    color: #1e293b;
    text-align: center;
}

.grafica-contenedor canvas {
    width: 100% !important;
    max-height: 350px;
}
        @media(max-width: 700px) {
            .cards {
                grid-template-columns: repeat(2, 1fr);
            }

            .container {
                padding: 15px;
            }

            .burbuja {
                max-width: 90%;
            }
        }
    </style>

</head>

<body>

<div class="container">

    <div class="header">
        <h1>📊 EconoAgent IA</h1>
        <p>Asistente inteligente de análisis macroeconómico</p>
    </div>


    <div class="cards">

        <div class="card" onclick="preguntaRapida('¿Cuál fue el PIB de Guatemala en 2023?')">
            💰<br><br>
            PIB
        </div>

        <div class="card" onclick="preguntaRapida('¿Cuál fue la inflación de Guatemala en 2023?')">
            📈<br><br>
            Inflación
        </div>

        <div class="card" onclick="preguntaRapida('¿Cuál es la deuda pública de Guatemala?')">
            🏦<br><br>
            Deuda pública
        </div>

        <div class="card" onclick="preguntaRapida('¿Cuál fue el crecimiento del PIB de Guatemala en 2023?')">
            📊<br><br>
            Crecimiento
        </div>

    </div>


    <div class="chat-container">

        <div class="chat-header">
            🤖 Agente Económico
        </div>

        <div id="chat"></div>

        <div class="input-area">

            <input
                type="text"
                id="mensaje"
                placeholder="Ej. Compara el PIB de Guatemala y Costa Rica..."
            >

            <button id="botonEnviar">
                Enviar
            </button>

        </div>

    </div>

</div>
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>

    const chat = document.getElementById("chat");
    const input = document.getElementById("mensaje");
    const boton = document.getElementById("botonEnviar");

function escaparHTML(texto) {
    const div = document.createElement("div");
    div.textContent = texto;
    return div.innerHTML;
}


function formatoTexto(texto) {

    let limpio = escaparHTML(texto);

    // Negritas tipo **texto**
    limpio = limpio.replace(
        /\*\*(.*?)\*\*/g,
        "<strong>$1</strong>"
    );

    return limpio;
}

function descargarTablaExcel(tabla) {

    const libro = XLSX.utils.table_to_book(
        tabla,
        {
            sheet: "Datos Económicos"
        }
    );

    XLSX.writeFile(
        libro,
        "datos_economicos.xlsx"
    );
}
function mostrarRespuestaAgente(texto, elemento) {
function crearGraficaDesdeTabla(tabla, contenedor) {

    const encabezados = Array.from(
        tabla.querySelectorAll("thead th")
    ).map(th => th.textContent.trim());

    const filas = Array.from(
        tabla.querySelectorAll("tbody tr")
    );

    if (encabezados.length < 2) {
        return;
    }

    const primeraColumna = encabezados[0].toLowerCase();

    if (
        primeraColumna !== "año" &&
        primeraColumna !== "anio" &&
        primeraColumna !== "year"
    ) {
        return;
    }

    const anios = [];
    const series = [];

    for (let i = 1; i < encabezados.length; i++) {
        series.push({
            nombre: encabezados[i],
            datos: []
        });
    }

    filas.forEach(fila => {

        const celdas = Array.from(
            fila.querySelectorAll("td")
        );

        if (celdas.length < 2) {
            return;
        }

        const anio = celdas[0].textContent.trim();

        anios.push(anio);

        for (let i = 1; i < celdas.length; i++) {

            let valorTexto = celdas[i]
                .textContent
                .trim()
                .replace(/,/g, "")
                .replace(/\s+/g, "")
                .replace(/\$/g, "")
                .replace(/%/g, "")
                .replace(/bn/gi, "")
                .replace(/millones/gi, "")
                .trim();

            const valor = parseFloat(valorTexto);

            series[i - 1].datos.push(
                isNaN(valor) ? null : valor
            );
        }

    });

    if (anios.length < 2) {
        return;
    }

    const graficaContenedor = document.createElement("div");
    graficaContenedor.classList.add("grafica-contenedor");

    const titulo = document.createElement("div");
    titulo.classList.add("grafica-titulo");
    titulo.textContent = "Evolución en el tiempo";

    const canvas = document.createElement("canvas");

    graficaContenedor.appendChild(titulo);
    graficaContenedor.appendChild(canvas);

    contenedor.appendChild(graficaContenedor);

    const datasets = series
        .filter(serie =>
            serie.datos.some(valor => valor !== null)
        )
        .map(serie => ({
            label: serie.nombre,
            data: serie.datos,
            tension: 0.25,
            fill: false
        }));

    new Chart(canvas, {
        type: "line",

        data: {
            labels: anios,
            datasets: datasets
        },

        options: {
            responsive: true,
            maintainAspectRatio: false,

            interaction: {
                mode: "index",
                intersect: false
            },

            plugins: {
                legend: {
                    display: true,
                    position: "top"
                }
            },

            scales: {
                x: {
                    title: {
                        display: true,
                        text: "Año"
                    }
                },

                y: {
                    beginAtZero: false
                }
            }
        }
    });
}
    const lineas = texto.split("\n");

    let i = 0;

    while (i < lineas.length) {

        const linea = lineas[i].trim();

        // Detectar una tabla Markdown
        if (
            linea.startsWith("|") &&
            i + 1 < lineas.length &&
            lineas[i + 1].includes("---")
        ) {

            const encabezados = linea
                .split("|")
                .filter(celda => celda.trim() !== "")
                .map(celda => celda.trim());

            // Saltar la línea |---|---|
            i += 2;

            const filas = [];

            while (
                i < lineas.length &&
                lineas[i].trim().startsWith("|")
            ) {

                const columnas = lineas[i]
                    .split("|")
                    .filter(celda => celda.trim() !== "")
                    .map(celda => celda.trim());

                filas.push(columnas);

                i++;
            }

            const contenedor = document.createElement("div");
            contenedor.classList.add("tabla-contenedor");

            const tabla = document.createElement("table");
            tabla.classList.add("tabla-economica");

            const thead = document.createElement("thead");
            const filaEncabezado = document.createElement("tr");

            encabezados.forEach(encabezado => {

                const th = document.createElement("th");

                th.textContent = encabezado.replace(/\*\*/g, "");

                filaEncabezado.appendChild(th);

            });

            thead.appendChild(filaEncabezado);

            tabla.appendChild(thead);


            const tbody = document.createElement("tbody");

            filas.forEach(fila => {

                const tr = document.createElement("tr");

                fila.forEach(valor => {

                    const td = document.createElement("td");

                    td.textContent = valor.replace(/\*\*/g, "");

                    tr.appendChild(td);

                });

                tbody.appendChild(tr);

            });

            tabla.appendChild(tbody);

            contenedor.appendChild(tabla);

const botonExcel = document.createElement("button");

botonExcel.textContent = "📥 Descargar Excel";

botonExcel.classList.add("btn-excel");

botonExcel.addEventListener("click", function() {

    descargarTablaExcel(tabla);

});

contenedor.appendChild(botonExcel);
crearGraficaDesdeTabla(tabla, contenedor);
elemento.appendChild(contenedor);

        }

        else {

            if (linea !== "") {

                const parrafo = document.createElement("div");

                parrafo.classList.add("texto-agente");

                parrafo.innerHTML = formatoTexto(linea);

                elemento.appendChild(parrafo);
            }

            i++;
        }
    }
}
function agregarMensaje(texto, tipo) {

    const contenedor = document.createElement("div");

    contenedor.classList.add("mensaje");
    contenedor.classList.add(tipo);

    const burbuja = document.createElement("div");

    burbuja.classList.add("burbuja");

    if (tipo === "agente") {

        mostrarRespuestaAgente(
            texto,
            burbuja
        );

    } else {

        burbuja.textContent = texto;

    }

    contenedor.appendChild(burbuja);
    chat.appendChild(contenedor);

    chat.scrollTop = chat.scrollHeight;

    return contenedor;
}


    agregarMensaje(
        "👋 Hola. Soy EconoAgent.\n\n" +
        "Puedo consultar PIB, PIB per cápita, inflación, deuda pública, " +
        "crecimiento económico y tipos de cambio.\n\n" +
        "También puedes pedirme comparar varios países.",
        "agente"
    );


    function preguntaRapida(texto) {

        input.value = texto;
        enviarMensaje();

    }


    async function enviarMensaje() {

        const mensaje = input.value.trim();

        if (mensaje === "") {
            return;
        }

        agregarMensaje(mensaje, "usuario");

        input.value = "";

        const cargando = agregarMensaje(
            "📊 Analizando datos económicos...",
            "agente"
        );

        cargando.querySelector(".burbuja").classList.add("cargando");


        try {

            const respuesta = await fetch("/preguntar", {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    mensaje: mensaje
                })

            });


            const datos = await respuesta.json();

            cargando.remove();

            agregarMensaje(
                datos.respuesta,
                "agente"
            );


        } catch (error) {

            cargando.remove();

            agregarMensaje(
                "⚠️ No se pudo conectar con el agente.",
                "agente"
            );

            console.error(error);

        }

    }


    boton.addEventListener("click", enviarMensaje);


    input.addEventListener("keydown", function(event) {

        if (event.key === "Enter") {
            enviarMensaje();
        }

    });

</script>

</body>

</html>
